<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#1a1520;--paper:#f7f4f0;--muted:#9e97a8;--accent:#7a6fa8;--accent-light:#ede9f8;--accent2:#c4a882;--border:#e2ddd8;--w1:#7a6fa8;--w2:#4a8a72;--w3:#b86a4a;--w4:#c4a882}
body{font-family:'Cormorant Garamond',Georgia,serif;background:var(--paper);color:var(--ink);min-height:100vh;padding:48px 24px 80px}
.wrap{max-width:820px;margin:0 auto}
.hdr{margin-bottom:48px}
.hdr-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.hdr-title{font-size:clamp(32px,5vw,52px);font-weight:300;line-height:1.05;letter-spacing:-.02em;margin-bottom:6px}
.hdr-title em{font-style:italic;color:var(--accent)}
.hdr-sub{font-size:16px;font-weight:300;color:var(--muted);font-style:italic}
.hdr-line{margin-top:24px;height:1px;background:linear-gradient(to right,var(--accent),transparent)}
.prog-wrap{margin-bottom:32px}
.prog-bar{background:var(--border);height:2px;border-radius:2px;overflow:hidden;margin-bottom:5px}
.prog-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .4s ease}
.prog-row{display:flex;align-items:center;gap:12px}
.prog-label{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted)}
.saved{font-family:'DM Mono',monospace;font-size:10px;color:var(--w2);opacity:0;transition:opacity .3s}
.saved.show{opacity:1}
.week{margin-bottom:48px}
.week-hdr{display:flex;align-items:baseline;gap:12px;margin-bottom:20px;padding-bottom:10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.wpill{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:3px 10px;border-radius:20px;white-space:nowrap}
.wdates{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.05em}
.wtitle{font-size:24px;font-weight:400;letter-spacing:-.01em}
.wtag{font-size:13px;font-style:italic;color:var(--muted);margin-left:auto}
.w1 .wpill{background:#ede9f8;color:#534AB7}.w2 .wpill{background:#e4f2ec;color:#0F6E56}.w3 .wpill{background:#f7ede7;color:#993C1D}.w4 .wpill{background:#f7f1e8;color:#854F0B}
.card{background:#fff;border:1px solid var(--border);border-radius:2px;margin-bottom:10px;overflow:hidden}
.card-top{display:flex;align-items:stretch;cursor:pointer;user-select:none}
.accent-bar{width:3px;flex-shrink:0}
.w1 .accent-bar{background:var(--w1)}.w2 .accent-bar{background:var(--w2)}.w3 .accent-bar{background:var(--w3)}.w4 .accent-bar{background:var(--w4)}
.card-sum{flex:1;padding:13px 16px;display:flex;align-items:center;gap:12px}
.chk{width:17px;height:17px;border:1.5px solid var(--border);border-radius:3px;flex-shrink:0;cursor:pointer;transition:all .15s;background:#fff;display:flex;align-items:center;justify-content:center}
.chk:hover{border-color:var(--accent)}
.chk.done{background:var(--accent);border-color:var(--accent)}
.chk.done::after{content:'';width:8px;height:4px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translateY(-1px);display:block}
.dlabel{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:48px;line-height:1.6}
.ddate{font-size:9px;color:var(--accent2);display:block;letter-spacing:.04em}
.dname{font-size:15px;font-weight:400;color:var(--ink)}
.dsub{font-size:12px;font-style:italic;color:var(--muted);margin-top:2px}
.tog{padding:13px 16px;font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);display:flex;align-items:center;transition:transform .2s}
.tog.open{transform:rotate(180deg)}
.body{display:none;border-top:1px solid var(--border)}
.body.open{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;background:#fff}
.sec{padding:18px 20px;border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
.sec:nth-child(2n){border-right:none}
.slabel{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.rlist{list-style:none}
.rlist li{font-size:13px;line-height:1.6;color:var(--ink);padding-left:14px;position:relative;margin-bottom:3px}
.rlist li::before{content:'—';position:absolute;left:0;color:var(--muted)}
.flist{list-style:none}
.flist li{font-size:13px;line-height:1.5;color:var(--ink);margin-bottom:5px;display:flex;align-items:flex-start;gap:8px}
.fchk{width:13px;height:13px;border:1px solid var(--border);border-radius:2px;flex-shrink:0;margin-top:2px;cursor:pointer;background:#fff;transition:all .15s;position:relative}
.fchk:hover{border-color:var(--accent)}
.fchk.done{background:var(--accent-light);border-color:var(--accent)}
.fchk.done::after{content:'✓';position:absolute;top:-2px;left:1px;font-size:10px;color:var(--accent);font-family:'DM Mono',monospace}
.review{background:#f9f7ff;border-top:1px solid #d9d2ef;padding:18px 20px}
.rlabel{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.rq{font-size:14px;font-style:italic;color:var(--ink);line-height:1.5;margin-bottom:5px;padding-left:14px;position:relative}
.rq::before{content:'↳';position:absolute;left:0;color:var(--accent);font-style:normal}
textarea{width:100%;margin-top:6px;margin-bottom:12px;min-height:52px;border:1px solid #d9d2ef;border-radius:4px;padding:9px 11px;font-family:'Cormorant Garamond',serif;font-size:14px;color:var(--ink);background:#fff;resize:vertical;outline:none;line-height:1.5}
textarea:focus{border-color:var(--accent)}
textarea::placeholder{color:var(--muted);font-style:italic}
.foot{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);text-align:center;margin-top:40px;letter-spacing:.08em}
@media(max-width:560px){.grid{grid-template-columns:1fr}.sec{border-right:none}.wtag{display:none}}
</style>
</head>

const SK='lunara-manifestation-april-2026';
let state={};
try{const s=localStorage.getItem(SK);if(s)state=JSON.parse(s);}catch(e){}

function save(){
  try{localStorage.setItem(SK,JSON.stringify(state));}catch(e){}
  const sv=document.getElementById('sv');
  sv.classList.add('show');
  setTimeout(()=>sv.classList.remove('show'),1500);
}

function k(wi,di,t,i){return `${wi}-${di}-${t}-${i}`;}

function render(){
  const app=document.getElementById('app');
  app.innerHTML='';
  WEEKS.forEach((week,wi)=>{
    const wdiv=document.createElement('div');
    wdiv.className=`week ${week.cls}`;
    wdiv.innerHTML=`<div class="week-hdr"><span class="wpill">${week.num}</span><span class="wdates">${week.dates}</span><span class="wtitle">${week.title}</span><span class="wtag">${week.tag}</span></div>`;
    week.days.forEach((day,di)=>{
      const card=document.createElement('div');
      card.className='card';
      const dk=k(wi,di,'done',0);
      const done=state[dk];
      card.innerHTML=`
        <div class="card-top" onclick="tog(this)">
          <div class="accent-bar"></div>
          <div class="card-sum">
            <div class="chk${done?' done':''}" onclick="toggleDone(event,this,'${dk}')"></div>
            <span class="dlabel">${day.n}<span class="ddate">${day.date}</span></span>
            <div><div class="dname">${day.name}</div><div class="dsub">${day.sub}</div></div>
          </div>
          <div class="tog">▾</div>
        </div>
        <div class="body">
          <div class="grid">
            <div class="sec">
              <div class="slabel">Read / Watch</div>
              <ul class="rlist">${day.read.map(r=>`<li>${r}</li>`).join('')}</ul>
            </div>
            <div class="sec">
              <div class="slabel">Focus</div>
              <ul class="flist">${day.focus.map((f,fi)=>{
                const fk=k(wi,di,'f',fi);
                return `<li><div class="fchk${state[fk]?' done':''}" onclick="toggleF(this,'${fk}')"></div><span>${f}</span></li>`;
              }).join('')}</ul>
            </div>
          </div>
          <div class="review">
            <div class="rlabel">Evening review — form your opinion</div>
            ${day.qs.map((q,qi)=>{
              const qk=k(wi,di,'q',qi);
              return `<div class="rq">${q}</div><textarea placeholder="Write here..." oninput="saveT(this,'${qk}')">${(state[qk]||'').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</textarea>`;
            }).join('')}
          </div>
        </div>`;
      wdiv.appendChild(card);
    });
    app.appendChild(wdiv);
  });
  updateProg();
}

function tog(el){
  const body=el.closest('.card').querySelector('.body');
  const t=el.querySelector('.tog');
  body.classList.toggle('open');
  t.classList.toggle('open');
}
function toggleDone(e,el,dk){
  e.stopPropagation();
  el.classList.toggle('done');
  state[dk]=el.classList.contains('done');
  save();updateProg();
}
function toggleF(el,fk){
  el.classList.toggle('done');
  state[fk]=el.classList.contains('done');
  save();
}
function saveT(el,qk){
  state[qk]=el.value;
  save();
}
function updateProg(){
  let done=0;
  WEEKS.forEach((w,wi)=>w.days.forEach((_,di)=>{if(state[k(wi,di,'done',0)])done++;}));
  const pct=Math.round((done/24)*100);
  document.getElementById('pf').style.width=pct+'%';
  document.getElementById('pl').textContent=done+' / 24 days complete';
}

render();
</script>
</body>
</html>
