<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily OS — April 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg: #e8e5df;
  --paper: #f0ede7;
  --card: #ebe8e2;
  --ink: #2a2420;
  --muted: #8a8278;
  --faint: #b5b0a8;
  --accent: #7b6fa0;
  --sage: #6a8c72;
  --border: rgba(42,36,32,0.1);
  --border-strong: rgba(42,36,32,0.18);
}

body {
  background: var(--bg);
  font-family: 'DM Sans', sans-serif;
  color: var(--ink);
  min-height: 100vh;
  padding-bottom: 80px;
}

/* ── PROGRESS BAR ── */
.top-bar { position:fixed; top:0; left:0; right:0; height:3px; background:rgba(42,36,32,0.08); z-index:100; }
.top-bar-fill { height:100%; background:var(--accent); transition:width 0.6s cubic-bezier(0.4,0,0.2,1); width:0%; }

/* ── HEADER ── */
.header { max-width:700px; margin:0 auto; padding:64px 32px 32px; }
.header-tag { font-size:11px; letter-spacing:4px; text-transform:uppercase; color:var(--muted); margin-bottom:16px; }
.header h1 { font-family:'Cormorant Garamond',serif; font-size:clamp(44px,8vw,72px); font-weight:300; line-height:1.0; margin-bottom:8px; }
.header h1 em { font-style:italic; color:var(--accent); }
.header-sub { font-family:'Cormorant Garamond',serif; font-size:15px; color:var(--muted); font-style:italic; }

/* ── MONTH STATS ── */
.month-stats { max-width:700px; margin:0 auto; padding:0 32px 32px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
.stat { text-align:center; }
.stat-num { font-family:'Cormorant Garamond',serif; font-size:32px; font-weight:300; color:var(--ink); line-height:1; }
.stat-label { font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-top:3px; }
.stat-divider { width:1px; height:36px; background:var(--border); }
.saved-pill { font-size:11px; color:var(--muted); opacity:0; transition:opacity 0.4s; font-style:italic; font-family:'Cormorant Garamond',serif; }
.saved-pill.show { opacity:1; }

/* ── CONTENT ── */
.content { max-width:700px; margin:0 auto; padding:0 32px; }

/* ── WEEK LABEL ── */
.week-label { font-size:9px; letter-spacing:4px; text-transform:uppercase; color:var(--muted); margin:32px 0 10px; padding-left:2px; }

/* ── DAY CARD ── */
.day-card {
  background:var(--paper);
  border:0.5px solid var(--border);
  border-radius:8px;
  margin-bottom:4px;
  overflow:hidden;
  transition:box-shadow 0.2s;
}

.day-card.today { border-color:rgba(123,111,160,0.35); box-shadow:0 0 0 1px rgba(123,111,160,0.15); }
.day-card.past { opacity:0.7; }

/* day header row */
.day-header {
  display:flex;
  align-items:center;
  padding:14px 18px;
  cursor:pointer;
  gap:16px;
  user-select:none;
  transition:background 0.15s;
}
.day-header:hover { background:rgba(42,36,32,0.03); }

.day-date {
  min-width:54px;
}
.day-num { font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:300; color:var(--ink); line-height:1; }
.day-weekday { font-size:9px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-top:2px; }

.today-badge {
  font-size:9px; letter-spacing:2px; text-transform:uppercase;
  color:var(--accent); background:rgba(123,111,160,0.1);
  padding:3px 8px; border-radius:20px; font-weight:500;
}

/* mini task dots */
.day-dots { display:flex; gap:5px; flex:1; flex-wrap:wrap; }
.dot {
  width:8px; height:8px; border-radius:50%;
  border:1px solid var(--border-strong);
  transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
  flex-shrink:0;
}
.dot.done { background:var(--accent); border-color:var(--accent); transform:scale(1.2); }
.dot.reflection-done { background:var(--sage); border-color:var(--sage); }

.day-score {
  font-size:12px; color:var(--muted); white-space:nowrap;
  font-family:'Cormorant Garamond',serif; font-style:italic;
}

.day-chevron { font-size:12px; color:var(--faint); transition:transform 0.25s; }
.day-chevron.open { transform:rotate(90deg); }

/* day body */
.day-body {
  display:none;
  border-top:0.5px solid var(--border);
  padding:18px 20px 20px;
}
.day-body.open { display:block; }

/* ── TASKS INSIDE DAY ── */
.tasks-grid { display:flex; flex-direction:column; gap:2px; margin-bottom:16px; }

.task-row {
  display:flex; align-items:center; gap:12px;
  padding:11px 14px;
  background:var(--bg);
  border-radius:4px;
  cursor:pointer;
  transition:background 0.15s;
  user-select:none;
}
.task-row:hover { background:#e2dfd9; }
.task-row.done .task-label { opacity:0.4; text-decoration:line-through; text-decoration-color:var(--muted); }

.task-check {
  width:20px; height:20px; border-radius:50%;
  border:1.5px solid var(--border-strong);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
  transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
.task-row.done .task-check { background:var(--accent); border-color:var(--accent); transform:scale(1.1); }

.check-svg { opacity:0; transform:scale(0) rotate(-45deg); transition:all 0.25s cubic-bezier(0.34,1.56,0.64,1); }
.task-row.done .check-svg { opacity:1; transform:scale(1) rotate(0deg); }

.task-label { font-size:13px; color:var(--ink); flex:1; transition:opacity 0.3s; }
.task-sublabel { font-size:11px; color:var(--muted); font-style:italic; font-family:'Cormorant Garamond',serif; }

/* ── SAUNA ROW ── */
.sauna-row-inner {
  display:flex; align-items:center; justify-content:space-between;
  padding:11px 14px; background:var(--bg); border-radius:4px; margin-bottom:16px;
}
.sauna-label-text { font-size:13px; color:var(--ink); }
.sauna-label-sub { font-size:11px; color:var(--muted); font-style:italic; font-family:'Cormorant Garamond',serif; margin-left:5px; }
.sauna-dots-inner { display:flex; gap:6px; }
.s-dot {
  width:24px; height:24px; border-radius:50%;
  border:1px solid var(--border-strong);
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  font-size:9px; color:transparent;
  transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
.s-dot:hover { border-color:var(--sage); }
.s-dot.done { background:var(--sage); border-color:var(--sage); color:white; transform:scale(1.15); }

/* ── REFLECTION ── */
.reflection-section { margin-top:4px; }
.ref-title { font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }

.ref-field { margin-bottom:10px; }
.ref-field-label { font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--faint); margin-bottom:5px; }
.ref-textarea {
  width:100%; background:var(--bg);
  border:0.5px solid var(--border); border-radius:4px;
  padding:10px 12px;
  font-size:13px; font-family:'Cormorant Garamond',serif;
  color:var(--ink); line-height:1.7; resize:none; outline:none;
  min-height:64px;
  transition:border-color 0.2s;
}
.ref-textarea:focus { border-color:rgba(123,111,160,0.4); }
.ref-textarea::placeholder { color:var(--muted); opacity:0.5; font-style:italic; }

/* ── CALORIES ── */
.cal-section { margin-top:14px; }
.cal-row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
.cal-input {
  flex:1; background:var(--bg); border:0.5px solid var(--border);
  border-radius:4px; padding:8px 12px;
  font-size:13px; font-family:'DM Sans',sans-serif; color:var(--ink);
  outline:none; transition:border-color 0.2s;
}
.cal-input:focus { border-color:rgba(123,111,160,0.35); }
.cal-input::placeholder { color:var(--muted); opacity:0.5; }
.cal-btn {
  background:var(--accent); color:white; border:none;
  border-radius:4px; padding:8px 14px;
  font-size:12px; font-family:'DM Sans',sans-serif;
  cursor:pointer; transition:opacity 0.2s; white-space:nowrap;
}
.cal-btn:hover { opacity:0.85; }
.cal-logged { font-size:12px; color:var(--muted); font-style:italic; font-family:'Cormorant Garamond',serif; }

/* ── MONTHLY TRACKERS ── */
.monthly-section { margin-top:40px; padding-top:24px; border-top:0.5px solid var(--border); }
.monthly-title { font-size:9px; letter-spacing:4px; text-transform:uppercase; color:var(--muted); margin-bottom:16px; }

.body-cards { display:grid; grid-template-columns:1fr 1fr; gap:4px; margin-bottom:4px; }
.body-card { background:var(--paper); border:0.5px solid var(--border); padding:16px 18px; }
.body-card:first-child { border-radius:8px 0 0 0; }
.body-card:nth-child(2) { border-radius:0 8px 0 0; }
.body-card-label { font-size:9px; letter-spacing:3px; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
.body-card-vals { display:flex; align-items:baseline; gap:6px; }
.body-start { font-family:'Cormorant Garamond',serif; font-size:26px; font-weight:300; }
.body-arrow { font-size:11px; color:var(--muted); }
.body-goal { font-family:'Cormorant Garamond',serif; font-size:18px; color:var(--accent); font-weight:300; }
.body-unit { font-size:11px; color:var(--muted); margin-left:1px; }

.end-measure {
  background:var(--paper); border:0.5px solid var(--border);
  border-top:none; border-radius:0 0 8px 8px;
  padding:13px 18px;
  font-size:12px; color:var(--muted);
  font-style:italic; font-family:'Cormorant Garamond',serif;
}

/* ── FOOTER ── */
.footer { max-width:700px; margin:48px auto 0; padding:0 32px; font-size:11px; color:var(--muted); text-align:center; font-style:italic; font-family:'Cormorant Garamond',serif; }

@media (max-width:520px) {
  .header, .content, .month-stats { padding-left:18px; padding-right:18px; }
  .body-cards { grid-template-columns:1fr; }
  .body-card:first-child { border-radius:8px 8px 0 0; }
  .body-card:nth-child(2) { border-radius:0; }
}
</style>
</head>
<body>

<div class="top-bar"><div class="top-bar-fill" id="topBar"></div></div>

<div class="header">
  <div class="header-tag">April 2026 · Daily OS</div>
  <h1>The month of<br><em>Becoming</em></h1>
  <p class="header-sub">Not a schedule. A standard you hold yourself to.</p>
</div>

<div class="month-stats">
  <div class="stat">
    <div class="stat-num" id="daysLeft">22</div>
    <div class="stat-label">Days left</div>
  </div>
  <div class="stat-divider"></div>
  <div class="stat">
    <div class="stat-num" id="totalDone">0</div>
    <div class="stat-label">Tasks done</div>
  </div>
  <div class="stat-divider"></div>
  <div class="stat">
    <div class="stat-num" id="streakCount">0</div>
    <div class="stat-label">Day streak</div>
  </div>
  <div class="saved-pill" id="savedPill">saved ✓</div>
</div>

<div class="content" id="mainContent"></div>

<div class="footer">notes save automatically · your data never leaves this device</div>

<script>
const KEY = 'daily_os_april_2026_v2';
const TODAY_DAY = 8; // April 8
const START_DAY = 7; // April 7
const TOTAL_DAYS = 24; // Apr 7–30

const WEEKDAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const TASKS = [
  { id:'gratitude', label:'Gratitude journal', sub:'10 things + why — The Magic' },
  { id:'getready',  label:'Get ready',          sub:'Makeup, hair — show up as her' },
  { id:'priming',   label:'5 min priming',       sub:'Who am I? Align with the new identity' },
  { id:'learning',  label:'Learning block',      sub:'2 hours — deep focus' },
  { id:'workout',   label:'Workout',             sub:'20 min+ — afternoon is ideal' },
  { id:'stretch',   label:'Stretching',          sub:'Splits & lower back — 15 min evening' },
  { id:'fantasy',   label:'Fantasy reading',     sub:'30 min+ before bed' },
];

function getState() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
}

function saveState(s) {
  localStorage.setItem(KEY, JSON.stringify(s));
  const p = document.getElementById('savedPill');
  p.classList.add('show');
  clearTimeout(window._st);
  window._st = setTimeout(() => p.classList.remove('show'), 1800);
}

function dayDate(dayNum) {
  // dayNum 1 = Apr 7, dayNum 2 = Apr 8, etc.
  const d = new Date(2026, 3, 6 + dayNum); // month is 0-indexed
  return d;
}

function dayLabel(dayNum) {
  const d = dayDate(dayNum);
  return WEEKDAYS[d.getDay()];
}

function aprilDate(dayNum) {
  return 6 + dayNum; // Apr 7 = dayNum 1
}

function toggle(dayNum, taskId) {
  const s = getState();
  if (!s[dayNum]) s[dayNum] = {};
  s[dayNum][taskId] = !s[dayNum][taskId];
  saveState(s);
  renderDay(dayNum, document.getElementById('day-' + dayNum));
  updateStats();
}

function toggleSauna(dayNum, i) {
  const s = getState();
  if (!s[dayNum]) s[dayNum] = {};
  if (!s[dayNum].sauna) s[dayNum].sauna = [false,false,false,false,false];
  s[dayNum].sauna[i] = !s[dayNum].sauna[i];
  saveState(s);
  renderSaunaDots(dayNum);
}

function logCal(dayNum) {
  const input = document.getElementById('cal-input-' + dayNum);
  const val = parseInt(input.value);
  if (!val || val < 1) return;
  const s = getState();
  if (!s[dayNum]) s[dayNum] = {};
  s[dayNum].cal = val;
  saveState(s);
  input.value = '';
  renderCalLogged(dayNum);
  renderDay(dayNum, document.getElementById('day-' + dayNum));
}

function saveRef(dayNum) {
  const s = getState();
  if (!s[dayNum]) s[dayNum] = {};
  s[dayNum].ref = {
    learned: document.getElementById('ref-learned-' + dayNum).value,
    perspective: document.getElementById('ref-perspective-' + dayNum).value,
    impl: document.getElementById('ref-impl-' + dayNum).value,
  };
  saveState(s);
  renderDay(dayNum, document.getElementById('day-' + dayNum));
}

function openDay(dayNum) {
  const body = document.getElementById('body-' + dayNum);
  const chev = document.getElementById('chev-' + dayNum);
  const isOpen = body.classList.toggle('open');
  chev.classList.toggle('open', isOpen);
}

function tasksDone(dayNum, s) {
  if (!s[dayNum]) return 0;
  return TASKS.filter(t => s[dayNum][t.id]).length;
}

function hasReflection(dayNum, s) {
  return s[dayNum] && s[dayNum].ref &&
    (s[dayNum].ref.learned || s[dayNum].ref.perspective || s[dayNum].ref.impl);
}

function renderSaunaDots(dayNum) {
  const s = getState();
  const wrap = document.getElementById('sauna-dots-' + dayNum);
  if (!wrap) return;
  const arr = (s[dayNum] && s[dayNum].sauna) || [false,false,false,false,false];
  wrap.querySelectorAll('.s-dot').forEach((d, i) => {
    d.classList.toggle('done', !!arr[i]);
    d.textContent = arr[i] ? '✓' : '';
  });
}

function renderCalLogged(dayNum) {
  const s = getState();
  const el = document.getElementById('cal-logged-' + dayNum);
  if (!el) return;
  const val = s[dayNum] && s[dayNum].cal;
  el.textContent = val ? val + ' kcal logged' : '';
}

function renderDay(dayNum, card) {
  const s = getState();
  const done = tasksDone(dayNum, s);
  const total = TASKS.length;
  const ref = hasReflection(dayNum, s);

  // update dots
  const dotsWrap = card.querySelector('.day-dots');
  if (dotsWrap) {
    dotsWrap.querySelectorAll('.dot').forEach((dot, i) => {
      if (i < TASKS.length) {
        dot.classList.toggle('done', !!(s[dayNum] && s[dayNum][TASKS[i].id]));
      } else {
        dot.classList.toggle('reflection-done', ref);
      }
    });
  }

  // update score
  const score = card.querySelector('.day-score');
  if (score) {
    if (done === 0 && !ref) score.textContent = '';
    else score.textContent = done + '/' + total + (ref ? ' + ✦' : '');
  }

  // update task rows
  TASKS.forEach(t => {
    const row = document.getElementById('task-' + dayNum + '-' + t.id);
    if (row) row.classList.toggle('done', !!(s[dayNum] && s[dayNum][t.id]));
  });

  // update top bar
  updateStats();
}

function updateStats() {
  const s = getState();
  let total = 0;
  let streak = 0;
  for (let d = 1; d <= TOTAL_DAYS; d++) {
    total += tasksDone(d, s);
    if (d < TODAY_DAY - START_DAY + 1 && tasksDone(d, s) >= 5) streak++;
  }
  document.getElementById('totalDone').textContent = total;
  document.getElementById('streakCount').textContent = streak;

  // top bar: % of possible tasks done so far (days up to today)
  const currentDay = TODAY_DAY - START_DAY + 1;
  const possible = currentDay * TASKS.length;
  const pct = possible > 0 ? Math.min(100, (total / possible) * 100) : 0;
  document.getElementById('topBar').style.width = pct + '%';

  // days left
  const dLeft = 30 - TODAY_DAY + 1;
  document.getElementById('daysLeft').textContent = dLeft;
}

function buildDayCard(dayNum) {
  const aprDate = aprilDate(dayNum);
  const weekday = dayLabel(dayNum);
  const isToday = dayNum === (TODAY_DAY - START_DAY + 1);
  const isPast = dayNum < (TODAY_DAY - START_DAY + 1);
  const s = getState();

  const card = document.createElement('div');
  card.className = 'day-card' + (isToday ? ' today' : '') + (isPast ? ' past' : '');
  card.id = 'day-' + dayNum;

  // dots html
  const dotsHtml = TASKS.map((t,i) => {
    const done = s[dayNum] && s[dayNum][t.id];
    return `<div class="dot${done ? ' done' : ''}"></div>`;
  }).join('') + `<div class="dot${hasReflection(dayNum,s) ? ' reflection-done' : ''}"></div>`;

  const done = tasksDone(dayNum, s);
  const scoreText = done > 0 ? done + '/' + TASKS.length + (hasReflection(dayNum,s) ? ' + ✦' : '') : '';

  card.innerHTML = `
    <div class="day-header" onclick="openDay(${dayNum})">
      <div class="day-date">
        <div class="day-num">Apr ${aprDate}</div>
        <div class="day-weekday">${weekday}</div>
      </div>
      ${isToday ? '<span class="today-badge">Today</span>' : ''}
      <div class="day-dots">${dotsHtml}</div>
      <div class="day-score">${scoreText}</div>
      <div class="day-chevron${isToday ? ' open' : ''}" id="chev-${dayNum}">›</div>
    </div>

    <div class="day-body${isToday ? ' open' : ''}" id="body-${dayNum}">

      <div class="tasks-grid">
        ${TASKS.map(t => {
          const isDone = s[dayNum] && s[dayNum][t.id];
          return `<div class="task-row${isDone ? ' done' : ''}" id="task-${dayNum}-${t.id}" onclick="toggle(${dayNum}, '${t.id}')">
            <div class="task-check">
              <svg class="check-svg" width="10" height="8" viewBox="0 0 10 8" fill="none">
                <path d="M1 3.5L3.5 6.5L9 1" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div>
              <div class="task-label">${t.label}</div>
              <div class="task-sublabel">${t.sub}</div>
            </div>
          </div>`;
        }).join('')}
      </div>

      <div class="sauna-row-inner">
        <div>
          <span class="sauna-label-text">Sauna</span>
          <span class="sauna-label-sub">aim 3–5× this week</span>
        </div>
        <div class="sauna-dots-inner" id="sauna-dots-${dayNum}">
          ${[0,1,2,3,4].map(i => {
            const on = s[dayNum] && s[dayNum].sauna && s[dayNum].sauna[i];
            return `<div class="s-dot${on ? ' done' : ''}" onclick="toggleSauna(${dayNum},${i})">${on ? '✓' : ''}</div>`;
          }).join('')}
        </div>
      </div>

      <div class="cal-section">
        <div class="cal-row">
          <input class="cal-input" type="number" id="cal-input-${dayNum}" placeholder="calories approx." min="0" max="9999">
          <button class="cal-btn" onclick="logCal(${dayNum})">Log</button>
        </div>
        <div class="cal-logged" id="cal-logged-${dayNum}">${s[dayNum] && s[dayNum].cal ? s[dayNum].cal + ' kcal logged' : ''}</div>
      </div>

      <div class="reflection-section">
        <div class="ref-title">Evening reflection</div>
        <div class="ref-field">
          <div class="ref-field-label">What I learned today</div>
          <textarea class="ref-textarea" id="ref-learned-${dayNum}" placeholder="The concept, the idea, what clicked..." rows="2" oninput="autoSaveRef(${dayNum})">${s[dayNum] && s[dayNum].ref ? s[dayNum].ref.learned || '' : ''}</textarea>
        </div>
        <div class="ref-field">
          <div class="ref-field-label">How it changes my view</div>
          <textarea class="ref-textarea" id="ref-perspective-${dayNum}" placeholder="Before I thought... now I see..." rows="2" oninput="autoSaveRef(${dayNum})">${s[dayNum] && s[dayNum].ref ? s[dayNum].ref.perspective || '' : ''}</textarea>
        </div>
        <div class="ref-field">
          <div class="ref-field-label">How I implemented it today</div>
          <textarea class="ref-textarea" id="ref-impl-${dayNum}" placeholder="In a conversation, a decision, a moment..." rows="2" oninput="autoSaveRef(${dayNum})">${s[dayNum] && s[dayNum].ref ? s[dayNum].ref.impl || '' : ''}</textarea>
        </div>
      </div>

    </div>
  `;

  return card;
}

function autoSaveRef(dayNum) {
  clearTimeout(window['_ref_' + dayNum]);
  window['_ref_' + dayNum] = setTimeout(() => saveRef(dayNum), 600);
}

function buildWeeks() {
  const content = document.getElementById('mainContent');

  const weeks = [
    { label: 'Week 1', days: [1,2,3,4,5,6,7] },       // Apr 7–13
    { label: 'Week 2', days: [8,9,10,11,12,13,14] },   // Apr 14–20
    { label: 'Week 3', days: [15,16,17,18,19,20,21] }, // Apr 21–27
    { label: 'Week 4', days: [22,23,24] },              // Apr 28–30
  ];

  weeks.forEach(week => {
    const wLabel = document.createElement('div');
    wLabel.className = 'week-label';
    wLabel.textContent = week.label;
    content.appendChild(wLabel);

    week.days.forEach(d => {
      if (d <= TOTAL_DAYS) {
        content.appendChild(buildDayCard(d));
      }
    });
  });

  // Monthly body tracking
  const monthly = document.createElement('div');
  monthly.className = 'monthly-section';
  monthly.innerHTML = `
    <div class="monthly-title">Body tracking — April</div>
    <div class="body-cards">
      <div class="body-card">
        <div class="body-card-label">Weight</div>
        <div class="body-card-vals">
          <span class="body-start">62.3<span class="body-unit">kg</span></span>
          <span class="body-arrow">→</span>
          <span class="body-goal">60<span class="body-unit" style="color:var(--muted)">kg</span></span>
        </div>
      </div>
      <div class="body-card">
        <div class="body-card-label">Body fat</div>
        <div class="body-card-vals">
          <span class="body-start">24<span class="body-unit">%</span></span>
          <span class="body-arrow">→</span>
          <span class="body-goal">22<span class="body-unit" style="color:var(--muted)">style="color:var(--muted)">%</span></span>
        </div>
      </div>
    </div>
    <div class="end-measure">Measure again at end of April — compare & adjust for May</div>
  `;
  content.appendChild(monthly);
}

buildWeeks();
updateStats();
</script>
